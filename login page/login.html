<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Edu-Essence</title>
  <!-- Google Fonts: Baskerville serif for subtext/inputs, Plus Jakarta Sans as modern display fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <main class="auth-wrapper">
    <div class="auth-card">
      
      <header class="auth-header">
        <h1 class="brand-title">Edu-Essence</h1>
        <p class="brand-subtitle">Welcome back to your learning space</p>
      </header>

      <form id="loginForm" novalidate>
        <!-- Email Field -->
        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-wrapper">
            <input 
              type="email" 
              id="email" 
              name="email" 
              placeholder="name@example.com" 
              autocomplete="email"
              required 
            />
          </div>
          <span class="field-error" id="emailError"></span>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="Enter your password" 
              autocomplete="current-password"
              required 
            />
            <button type="button" id="togglePassword" class="password-toggle-btn" aria-label="Toggle password visibility">
              Show
            </button>
          </div>
          <span class="field-error" id="passwordError"></span>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="btn-submit">
          Login
        </button>
      </form>

      <footer class="auth-footer">
        <!-- AFTER -->
<p>Don't have an account? <a href="register.html">Create an account</a></p>
      </footer>

    </div>
  </main>

  <script src="login.js"></script>
</body>
</html>
